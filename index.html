<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP Section Generator — 資料請求LP</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #A81417;
    --accent2: #DC0107;
    --accent3: #FF422E;
    --text: #e8e6f0;
    --text2: #9591a8;
    --success: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 10px;
    --font: 'Inter', 'Hiragino Sans', 'Meiryo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .03em; }
  header h1 span { color: #FF422E; }
  .header-actions { display: flex; gap: 8px; }

  .layout { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; height: calc(100vh - 56px); }

  .left-panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text2); transition: all .2s; border-bottom: 2px solid transparent; }
  .tab.active { color: #FF422E; border-bottom-color: #A81417; }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px; }
  .panel-content { display: none; }
  .panel-content.active { display: block; }

  label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  input[type="text"], input[type="password"], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 13px; padding: 9px 12px; transition: border-color .2s; outline: none; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent2); }
  textarea { min-height: 80px; line-height: 1.5; }
  .form-group { margin-bottom: 14px; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; white-space: nowrap; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover { background: var(--accent3); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid transparent; }
  .btn-danger:hover { border-color: var(--danger); background: rgba(248,113,113,.1); }
  .btn-success { background: var(--success); color: #000; }
  .btn-success:hover { opacity: .85; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-full { width: 100%; }

  .section-list { display: flex; flex-direction: column; gap: 8px; }
  .section-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: all .2s; }
  .section-card:hover { border-color: var(--accent2); }
  .section-card.active { border-color: var(--accent2); background: rgba(220,1,7,.08); }
  .section-card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .section-number { width: 22px; height: 22px; background: var(--accent2); color: #fff; border-radius: 50%; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .section-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-status { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
  .status-done { background: rgba(74,222,128,.15); color: var(--success); }
  .status-pending { background: rgba(251,191,36,.12); color: var(--warn); }
  .status-generating { background: rgba(220,1,7,.15); color: #FF422E; }
  .section-prompt-preview { font-size: 11px; color: var(--text2); margin-top: 6px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .right-panel { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .right-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .right-header h2 { font-size: 14px; font-weight: 700; }
  .right-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  .editor-pane { padding: 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .editor-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  .preview-pane { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; overflow-y: auto; }
  .preview-label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; align-self: flex-start; }
  .preview-img-wrap { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .preview-img-wrap.banner-wrap { max-width: 600px; }
  .preview-img-wrap img { width: 100%; display: block; }
  .preview-placeholder { width: 100%; max-width: 400px; background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; color: var(--text2); gap: 8px; font-size: 13px; }
  .preview-placeholder .icon { font-size: 32px; }

  .lp-preview { display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 0; }
  .lp-section-img { width: 100%; max-width: 390px; display: block; }
  .lp-section-wrap { width: 100%; max-width: 390px; position: relative; }
  .lp-section-wrap.banner-wrap { max-width: 600px; }
  .lp-section-overlay { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 9999; transition: transform .3s; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  .settings-section { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .settings-section h3 { font-size: 12px; font-weight: 700; color: #FF422E; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .api-status { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-ok { background: var(--success); }
  .dot-ng { background: var(--danger); }

  .size-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .size-opt { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; cursor: pointer; text-align: center; transition: all .2s; font-size: 11px; }
  .size-opt.active { border-color: var(--accent2); background: rgba(220,1,7,.1); color: #FF422E; }
  .size-opt .size-ratio { font-size: 16px; margin-bottom: 2px; }

  .cta-banner-notice { background: rgba(255,66,46,.1); border: 1px solid rgba(255,66,46,.3); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #FF9589; margin-bottom: 12px; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  .preset-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--text2); cursor: pointer; text-align: left; width: 100%; margin-bottom: 6px; transition: all .2s; }
  .preset-btn:hover { border-color: var(--accent2); color: var(--text); }
  .preset-section { font-size: 10px; color: #FF422E; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }

  .ref-img-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: all .2s; text-align: center; background: var(--bg); }
  .ref-img-area:hover { border-color: var(--accent2); }
  .ref-img-area.has-img { border-style: solid; border-color: var(--accent2); background: rgba(220,1,7,.04); }
  .ref-img-filename { font-size: 12px; color: #FF9589; font-weight: 600; margin-top: 6px; word-break: break-all; }
  .ref-img-thumb { width: 100%; max-height: 120px; object-fit: contain; border-radius: 6px; margin-top: 8px; display: block; }
  .ref-img-hint { font-size: 11px; color: var(--text2); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>LP Generator <span>— 資料請求LP</span></h1>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="showTab('settings-tab')">⚙ 設定</button>
    <button class="btn btn-ghost btn-sm" onclick="showMainView('lp-preview-view')">🖥 LPプレビュー</button>
    <button class="btn btn-success btn-sm" onclick="exportLP()">⬇ エクスポート</button>
  </div>
</header>

<div class="layout">
  <div class="left-panel">
    <div class="panel-tabs">
      <div class="tab active" onclick="showTab('sections-tab')" id="sections-tab-btn">📋 セクション</div>
      <div class="tab" onclick="showTab('presets-tab')" id="presets-tab-btn">⚡ プリセット</div>
      <div class="tab" onclick="showTab('settings-tab')" id="settings-tab-btn">⚙ 設定</div>
    </div>
    <div class="panel-body">

      <!-- Sections Tab -->
      <div class="panel-content active" id="sections-tab">
        <button class="btn btn-primary btn-full" style="margin-bottom:14px" onclick="addSection()">＋ セクション追加</button>
        <div class="section-list" id="sectionList">
          <div class="empty-state">
            <div class="icon">📄</div>
            <div>「⚡ プリセット」タブから<br>セクションを一括追加できます</div>
          </div>
        </div>
      </div>

      <!-- Presets Tab -->
      <div class="panel-content" id="presets-tab">
        <div class="settings-section">
          <h3>⚡ フォーサイト行政書士 全セクション</h3>
          <p style="font-size:12px;color:var(--text2);margin-bottom:12px">15セクション＋CTAバナーをまとめて追加します</p>
          <button class="btn btn-primary btn-full" onclick="loadAllPresets()">全セクションを一括追加</button>
        </div>
        <div class="settings-section">
          <h3>📋 個別追加</h3>
          <div id="presetList"></div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div class="panel-content" id="settings-tab">
        <div class="settings-section">
          <h3>🔑 API設定</h3>
          <div class="form-group">
            <label>OpenAI APIキー</label>
            <input type="password" id="apiKeyInput" placeholder="sk-..." oninput="saveApiKey()">
            <div class="api-status" id="apiStatus">
              <div class="dot dot-ng" id="apiDot"></div>
              <span id="apiStatusText">未設定</span>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <h3>🎨 共通スタイルルール（プロジェクト管理）</h3>
          <div class="form-group">
            <label>プロジェクトを選択</label>
            <div style="display:flex;gap:6px">
              <select id="ruleProjectSelect" onchange="loadRuleProject()" style="flex:1"></select>
              <button class="btn btn-ghost btn-sm" onclick="deleteRuleProject()" title="削除">🗑</button>
            </div>
          </div>
          <div class="form-group">
            <label>プロジェクト名</label>
            <input type="text" id="ruleProjectName" placeholder="例：フォーサイト行政書士">
          </div>
          <div class="form-group">
            <label>スタイルルール内容</label>
            <textarea id="globalRules" rows="10"></textarea>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="saveRuleProject()">💾 保存</button>
            <button class="btn btn-ghost btn-sm" onclick="applyRuleProject()">✅ 生成に適用</button>
            <button class="btn btn-ghost btn-sm" onclick="newRuleProject()">＋ 新規作成</button>
          </div>
          <div id="activeRuleLabel" style="font-size:11px;color:#FF9589;margin-top:8px"></div>
        </div>
        <div class="settings-section">
          <h3>📦 データ管理</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="exportData()">💾 JSONエクスポート</button>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">📂 JSONインポート</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑 全削除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel" id="rightPanel">
    <div id="editor-view" style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div class="right-header">
        <h2 id="editorTitle">セクションを選択してください</h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" id="moveUpBtn" onclick="moveSection(-1)" disabled>↑</button>
          <button class="btn btn-ghost btn-sm" id="moveDownBtn" onclick="moveSection(1)" disabled>↓</button>
          <button class="btn btn-danger btn-sm" id="deleteSectionBtn" onclick="deleteSection()" disabled>削除</button>
        </div>
      </div>
      <div class="right-body">
        <div class="editor-pane" id="editorPane">
          <div class="empty-state">
            <div class="icon">👈</div>
            <div>左の「⚡ プリセット」から<br>セクションを追加して始めましょう</div>
          </div>
        </div>
        <div class="preview-pane" id="previewPane" style="display:none">
          <div class="preview-label">生成結果プレビュー</div>
          <div id="imgContainer"></div>
        </div>
      </div>
    </div>

    <div id="lp-preview-view" style="display:none;flex-direction:column;height:100%;overflow:hidden">
      <div class="right-header">
        <h2>🖥 LP全体プレビュー（スマホサイズ）</h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="showMainView('editor-view')">← 編集に戻る</button>
          <button class="btn btn-success btn-sm" onclick="exportLP()">⬇ エクスポート</button>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto">
        <div class="lp-preview" id="lpPreview"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── Constants ───
const DEFAULT_GLOBAL_RULES = `【商品情報】
商品名：フォーサイト 行政書士通信講座（2026年試験対策）
- 紙のフルカラーテキスト + eラーニング「ManaBun」 + eライブスタディの3本柱
- 最短4ヵ月で合格を目指す通信講座
- 合格率58.5%（2025年実績／全国平均の約4.0倍）
- 累計受講者数45万人

【ターゲット】
30〜50代の働く社会人（男女）。独学挫折経験あり、時間がない、コスパ重視。

【カラーパレット】
- メイン：レッド #A81417, #DC0107
- サブ：ブライトオレンジ #FF422E
- アクセント：コーラルオレンジ #FF9589
- 背景：ライトグレー #D8D8D8, #E7E7E7 / ホワイト #FFFFFF
- テキスト：ブラック #333333
- 使用禁止色：原色の青・緑・紫・鮮明なピンク

【トンマナ】
- 信頼感・誠実・専門性がありながら親しみやすい
- 日本のトップクラスSaaS・資格スクールのプロデザイナーが2025年に制作したような情報密度の高いプレミアムLP
- フォント：全てゴシック体（Noto Sans JP相当）
- 写真：実写ベース（合格者・講師は本物の表情）
- グラフ：清潔感のあるフラットデザイン

【禁止事項】
- 明朝体・サンセリフ系フォント
- スカスカ・余白だけのスライド表紙的構成
- PowerPoint素材・無料テンプレート風
- ストックフォト的な切り抜き合成感
- チープな円グラフ・棒グラフ
- ビビッドすぎる追加色

【CTAボタン非描画ルール】
以下は画像内に絶対に描画しない：
- ボタン形状の図形（角丸矩形、押せそうな箱）
- 行動喚起テキスト（「資料請求はこちら」「今すぐ申し込む」等）
- ボタンを示唆する矢印アイコンや押下エフェクト
描画してよい要素：見出し・数字・商品名・価格・キャンペーン文言・STEP表記・説明文`;

const SECTION_PRESETS = [
  { id: 1, name: 'FV（ファストビュー）', type: 'hero', size: '1024x1536',
    prompt: `【セクション1：ファストビュー】スマホLP用縦長画像（9:16）
ビジュアル：30〜40代女性、ショートカット、ナチュラルで知的な雰囲気。テキスト（教材）を胸元に抱え、カメラ目線でこちらを見ている。表情：自信があり穏やかに微笑む。服装：清潔感のあるオフィスカジュアル。背景：明るい室内（ホワイト〜ライトグレー基調）。
描画テキスト（全てゴシック体・Noto Sans JP）：
- 「行政書士」（最上部・中サイズ）
- 「合格率は全国平均の4.0倍！」（メインキャッチ・大サイズ・レッド）
- 「不合格なら全額返金」（サブ）
- 「スピード合格講座 54,800円〜」
- 「最短合格実績 4ヶ月」
下部：3つのアイコン付き訴求エリア（返金保証・価格・最短期間）を横並び配置。
数字「4.0倍」は最大サイズで赤く強調。` },
  { id: 2, name: '合格率比較', type: 'comparison', size: '1024x1536',
    prompt: `【セクション2：合格率比較】スマホLP用縦長画像（9:16）
見出し：「比べて納得！の合格率」
キャッチ：「全国平均の4.0倍」
メインビジュアル：フラットデザインのドーナツグラフ2つを並べて対比。
- 左：全国平均「14.54%」（小さいグラフ・グレー系）
- 右：フォーサイト「58.5%」（大きいグラフ・レッド）
- 2つの間に「4.0倍！」を特大・レッドで強調表示
注釈：「全額返金保証制度の確認テスト・学力テストの条件を満たした受講生のうち、受験番号を提出した合格者数で算出　※2025年度試験の実績」（小文字）` },
  { id: 3, name: '不安解消＆強み', type: 'feature', size: '1024x1536',
    prompt: `【セクション3：不安解消＆フォーサイトの強み】スマホLP用縦長画像（9:16）
見出し：「通信講座・オンラインスクールで行政書士を目指したい。でも・・・」
構成：悩み→解決を3セットで縦に配置。各セットに男性人物イラストまたは写真風。
不安①「デジタル教材だけでは不安…」→「フォーサイトなら 暗記に効く紙のテキストも付与されるから 記憶に残りやすい！」
不安②「学習時間が割けるか心配…」→「フォーサイトなら スキマ時間を無駄にしないeラーニング＋講座動画で 効率よく学べる！」
不安③「高い受講料を払って、落ちたらどうしよう…」→「フォーサイトなら 万が一不合格でも、全額返金か翌年も無料受講！」

// ─── State ───
let sections = [];
let activeIdx = null;

// ─── Init ───
window.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  const key = localStorage.getItem('lp_apikey') || '';
  document.getElementById('apiKeyInput').value = key;
  updateApiStatus(key);
  // 旧形式の共通ルールを移行
  const oldRules = localStorage.getItem('lp_globalrules');
  if (oldRules) {
    const projects = loadRuleProjects();
    if (!projects.find(p => p.name === 'デフォルト')) {
      projects.unshift({ name: 'デフォルト', rules: oldRules });
      saveRuleProjects(projects);
      if (!getActiveRuleProjectName()) localStorage.setItem('lp_active_rule_project', 'デフォルト');
    }
  }
  // フォーサイトプロジェクトを初期追加
  const projects = loadRuleProjects();
  if (projects.length === 0) {
    projects.push({ name: 'フォーサイト行政書士', rules: DEFAULT_GLOBAL_RULES });
    saveRuleProjects(projects);
    localStorage.setItem('lp_active_rule_project', 'フォーサイト行政書士');
  }
  renderRuleProjectSelect();
  const active = getActiveRuleProjectName();
  if (active) {
    const p = loadRuleProjects().find(x => x.name === active);
    if (p) { document.getElementById('ruleProjectName').value = p.name; document.getElementById('globalRules').value = p.rules; }
  }
  renderSectionList();
  renderPresetList();
});

function renderPresetList() {
  const el = document.getElementById('presetList');
  el.innerHTML = SECTION_PRESETS.map(p => `
    <div>
      <div class="preset-section">${p.isBanner ? '追従CTAバナー' : 'Section ' + p.id}</div>
      <button class="preset-btn" onclick="addPreset(${p.id})">＋ ${p.name}</button>
    </div>
  `).join('');
}

function loadAllPresets() {
  if (sections.length > 0) {
    if (!confirm('現在のセクションに追加しますか？')) return;
  }
  SECTION_PRESETS.forEach(p => {
    sections.push({
      id: Date.now() + Math.random(),
      name: p.name,
      sectionType: p.type,
      size: p.size,
      isBanner: p.isBanner || false,
      prompt: p.prompt,
      customRules: '',
      imageBase64: null,
      status: 'pending'
    });
  });
  saveToStorage();
  renderSectionList();
  showTab('sections-tab');
  showToast(`✓ ${SECTION_PRESETS.length}件のセクションを追加しました`, 'success');
}

function addPreset(presetId) {
  const p = SECTION_PRESETS.find(x => x.id === presetId);
  if (!p) return;
  sections.push({
    id: Date.now() + Math.random(),
    name: p.name,
    sectionType: p.type,
    size: p.size,
    isBanner: p.isBanner || false,
    prompt: p.prompt,
    customRules: '',
    imageBase64: null,
    status: 'pending'
  });
  saveToStorage();
  renderSectionList();
  selectSection(sections.length - 1);
  showTab('sections-tab');
  showToast(`✓ ${p.name} を追加しました`, 'success');
}

// ─── Storage ───
function loadFromStorage() {
  try { const r = localStorage.getItem('lp_sections'); if (r) sections = JSON.parse(r); } catch(e) { sections = []; }
}
function saveToStorage() { localStorage.setItem('lp_sections', JSON.stringify(sections)); }
function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('lp_apikey', key);
  updateApiStatus(key);
}
function updateApiStatus(key) {
  const ok = key.startsWith('sk-') && key.length > 20;
  document.getElementById('apiDot').className = 'dot ' + (ok ? 'dot-ok' : 'dot-ng');
  document.getElementById('apiStatusText').textContent = ok ? '設定済み' : '未設定';
}
// ─── Rule Projects ───
function loadRuleProjects() {
  try { return JSON.parse(localStorage.getItem('lp_rule_projects') || '[]'); } catch(e) { return []; }
}
function saveRuleProjects(projects) {
  localStorage.setItem('lp_rule_projects', JSON.stringify(projects));
}
function getActiveRuleProjectName() {
  return localStorage.getItem('lp_active_rule_project') || '';
}
function renderRuleProjectSelect() {
  const projects = loadRuleProjects();
  const active = getActiveRuleProjectName();
  const sel = document.getElementById('ruleProjectSelect');
  if (!sel) return;
  sel.innerHTML = projects.length === 0
    ? '<option value="">（プロジェクトなし）</option>'
    : projects.map(p => `<option value="${escHtml(p.name)}" ${p.name === active ? 'selected' : ''}>${escHtml(p.name)}</option>`).join('');
  updateActiveRuleLabel();
}
function updateActiveRuleLabel() {
  const el = document.getElementById('activeRuleLabel');
  const active = getActiveRuleProjectName();
  if (el) el.textContent = active ? `✅ 現在の適用プロジェクト：${active}` : '未適用（生成時にルールが使われません）';
}
function loadRuleProject() {
  const name = document.getElementById('ruleProjectSelect').value;
  const projects = loadRuleProjects();
  const p = projects.find(x => x.name === name);
  if (p) {
    document.getElementById('ruleProjectName').value = p.name;
    document.getElementById('globalRules').value = p.rules;
  }
}
function saveRuleProject() {
  const name = document.getElementById('ruleProjectName').value.trim();
  const rules = document.getElementById('globalRules').value.trim();
  if (!name) { showToast('プロジェクト名を入力してください', 'error'); return; }
  if (!rules) { showToast('ルール内容を入力してください', 'error'); return; }
  const projects = loadRuleProjects();
  const idx = projects.findIndex(x => x.name === name);
  if (idx >= 0) { projects[idx].rules = rules; } else { projects.push({ name, rules }); }
  saveRuleProjects(projects);
  renderRuleProjectSelect();
  document.getElementById('ruleProjectSelect').value = name;
  showToast(`✓「${name}」を保存しました`, 'success');
}
function applyRuleProject() {
  const name = document.getElementById('ruleProjectSelect').value;
  if (!name) { showToast('プロジェクトを選択してください', 'error'); return; }
  localStorage.setItem('lp_active_rule_project', name);
  updateActiveRuleLabel();
  showToast(`✅「${name}」を生成ルールとして適用しました`, 'success');
}
function newRuleProject() {
  document.getElementById('ruleProjectName').value = '';
  document.getElementById('globalRules').value = DEFAULT_GLOBAL_RULES;
  document.getElementById('ruleProjectSelect').value = '';
  showToast('新規プロジェクトを作成できます。名前を入力して保存してください');
}
function deleteRuleProject() {
  const name = document.getElementById('ruleProjectSelect').value;
  if (!name) return;
  if (!confirm(`「${name}」を削除しますか？`)) return;
  const projects = loadRuleProjects().filter(x => x.name !== name);
  saveRuleProjects(projects);
  if (getActiveRuleProjectName() === name) localStorage.removeItem('lp_active_rule_project');
  renderRuleProjectSelect();
  document.getElementById('ruleProjectName').value = '';
  document.getElementById('globalRules').value = '';
  showToast(`「${name}」を削除しました`);
}
function getActiveGlobalRules() {
  const active = getActiveRuleProjectName();
  if (!active) return DEFAULT_GLOBAL_RULES;
  const projects = loadRuleProjects();
  const p = projects.find(x => x.name === active);
  return p ? p.rules : DEFAULT_GLOBAL_RULES;
}
function saveGlobalRules() { /* 旧関数・互換用 */ }
function resetGlobalRules() {
  document.getElementById('globalRules').value = DEFAULT_GLOBAL_RULES;
}

// ─── Section management ───
function addSection() {
  sections.push({ id: Date.now(), name: `セクション ${sections.length + 1}`, sectionType: 'custom', size: '1024x1536', isBanner: false, prompt: '', customRules: '', imageBase64: null, status: 'pending' });
  saveToStorage(); renderSectionList(); selectSection(sections.length - 1); showTab('sections-tab');
}
function deleteSection() {
  if (activeIdx === null) return;
  if (!confirm(`「${sections[activeIdx].name}」を削除しますか？`)) return;
  sections.splice(activeIdx, 1); activeIdx = null; saveToStorage(); renderSectionList(); renderEditor();
}
function moveSection(dir) {
  if (activeIdx === null) return;
  const n = activeIdx + dir;
  if (n < 0 || n >= sections.length) return;
  [sections[activeIdx], sections[n]] = [sections[n], sections[activeIdx]];
  activeIdx = n; saveToStorage(); renderSectionList(); renderEditor();
}
function selectSection(idx) { activeIdx = idx; renderSectionList(); renderEditor(); }

// ─── Render ───
function renderSectionList() {
  const list = document.getElementById('sectionList');
  if (sections.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📄</div><div>「⚡ プリセット」タブから<br>セクションを一括追加できます</div></div>`;
    return;
  }
  const statusMap = { done: ['status-done','✓ 完了'], pending: ['status-pending','未生成'], generating: ['status-generating','生成中'] };
  list.innerHTML = sections.map((s, i) => {
    const [cls, label] = statusMap[s.status] || statusMap.pending;
    return `<div class="section-card ${i === activeIdx ? 'active' : ''}" onclick="selectSection(${i})">
      <div class="section-card-header">
        <div class="section-number">${i+1}</div>
        <div class="section-name">${escHtml(s.name)}</div>
        <div class="section-status ${cls}">${label}</div>
      </div>
      ${s.isBanner ? '<div class="section-prompt-preview" style="color:#FF9589">📏 横長バナーサイズ</div>' : ''}
      ${(() => { const imgs = s.refImages || (s.refImageBase64 ? [s.refImageName] : []); return imgs.length > 0 ? `<div class="section-prompt-preview" style="color:#FF9589">📎 参考画像 ${imgs.length}枚: ${imgs.map(x => escHtml(typeof x === 'string' ? x : x.name)).join(', ')}</div>` : ''; })()}
    </div>`;
  }).join('');
}

function renderEditor() {
  const pane = document.getElementById('editorPane');
  const previewPane = document.getElementById('previewPane');
  const titleEl = document.getElementById('editorTitle');
  const upBtn = document.getElementById('moveUpBtn');
  const dnBtn = document.getElementById('moveDownBtn');
  const delBtn = document.getElementById('deleteSectionBtn');

  if (activeIdx === null || !sections[activeIdx]) {
    pane.innerHTML = `<div class="empty-state"><div class="icon">👈</div><div>左のリストからセクションを選んでください</div></div>`;
    previewPane.style.display = 'none';
    titleEl.textContent = 'セクションを選択してください';
    upBtn.disabled = dnBtn.disabled = delBtn.disabled = true;
    return;
  }

  const s = sections[activeIdx];
  titleEl.textContent = `${activeIdx + 1}. ${s.name}`;
  upBtn.disabled = activeIdx === 0;
  dnBtn.disabled = activeIdx === sections.length - 1;
  delBtn.disabled = false;

  const bannerNotice = s.isBanner ? `<div class="cta-banner-notice">📏 このセクションは横長バナーサイズ（追従CTA用）で生成されます</div>` : '';

  pane.innerHTML = `
    ${bannerNotice}
    <div class="form-row">
      <div class="form-group" style="flex:1.5">
        <label>セクション名</label>
        <input type="text" value="${escHtml(s.name)}" oninput="updateSection('name', this.value)">
      </div>
      <div class="form-group" style="flex:1">
        <label>サイズ</label>
        <select onchange="updateSection('size', this.value)">
          <option value="1024x1536" ${s.size==='1024x1536'?'selected':''}>縦長9:16（スマホ）</option>
          <option value="1536x1024" ${s.size==='1536x1024'?'selected':''}>横長（PC）</option>
          <option value="1024x1024" ${s.size==='1024x1024'?'selected':''}>正方形</option>
          <option value="1792x256" ${s.size==='1792x256'?'selected':''}>横長バナー（CTA）</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>セクション内容・プロンプト</label>
      <textarea rows="8" oninput="updateSection('prompt', this.value)">${escHtml(s.prompt)}</textarea>
    </div>
    <div class="form-group">
      <label>追加ルール（このセクション専用・任意）</label>
      <textarea rows="2" oninput="updateSection('customRules', this.value)" placeholder="このセクション専用の追加指示があれば入力">${escHtml(s.customRules||'')}</textarea>
    </div>
    <div class="form-group">
      <label>参考画像（最大5枚・任意）</label>
      <input type="file" id="refImgInput_${activeIdx}" accept="image/*" multiple style="display:none" onchange="handleRefImages(${activeIdx}, this)">
      ${(() => {
        const imgs = s.refImages || (s.refImageBase64 ? [{ base64: s.refImageBase64, mime: s.refImageMime, name: s.refImageName }] : []);
        const slots = Array.from({ length: 5 }, (_, i) => imgs[i] || null);
        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          ${slots.map((img, i) => img ? `
            <div class="ref-img-area has-img" style="position:relative">
              <div class="ref-img-filename">📎 ${escHtml(img.name)}</div>
              <img class="ref-img-thumb" src="data:${img.mime};base64,${img.base64}" alt="参考${i+1}">
              <button class="btn btn-danger btn-sm" style="margin-top:6px;width:100%" onclick="removeRefImageAt(${activeIdx},${i})">✕ 削除</button>
            </div>
          ` : `
            <div class="ref-img-area" onclick="document.getElementById('refImgInput_${activeIdx}').click()" style="min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-size:18px">＋</div>
              <div style="font-size:11px;color:var(--text2);margin-top:4px">画像${i+1}</div>
            </div>
          `).join('')}
        </div>
        <div style="font-size:11px;color:var(--text2)">jpg / png / webp 対応。複数選択可。${imgs.length > 0 ? `<span style="color:#FF9589">${imgs.length}枚設定済み</span>` : ''}</div>`;
      })()}
    </div>
    <div class="editor-actions">
      <button class="btn btn-primary" onclick="generateImage(${activeIdx})" id="genBtn_${activeIdx}" ${s.status==='generating'?'disabled':''}>
        ${s.status==='generating' ? '<span class="spinner"></span> 生成中...' : '🎨 画像生成'}
      </button>
      ${s.imageBase64 ? `<button class="btn btn-ghost btn-sm" onclick="regenerateImage(${activeIdx})">🔄 再生成</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="buildPromptPreview(${activeIdx})">📋 プロンプト確認</button>
    </div>
  `;

  previewPane.style.display = 'flex';
  if (s.imageBase64) {
    const wrapClass = s.isBanner ? 'preview-img-wrap banner-wrap' : 'preview-img-wrap';
    document.getElementById('imgContainer').innerHTML = `<div class="${wrapClass}"><img src="data:image/png;base64,${s.imageBase64}" alt="${escHtml(s.name)}"></div>`;
  } else {
    document.getElementById('imgContainer').innerHTML = `<div class="preview-placeholder"><div class="icon">🖼</div><div>画像を生成するとここに表示されます</div></div>`;
  }
}

function updateSection(field, value) {
  if (activeIdx === null) return;
  sections[activeIdx][field] = value;
  if (field === 'name') { document.getElementById('editorTitle').textContent = `${activeIdx + 1}. ${value}`; renderSectionList(); }
  saveToStorage();
}

function handleRefImages(idx, input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const existing = sections[idx].refImages || (sections[idx].refImageBase64 ? [{ base64: sections[idx].refImageBase64, mime: sections[idx].refImageMime, name: sections[idx].refImageName }] : []);
  const remaining = 5 - existing.length;
  const toAdd = files.slice(0, remaining);
  if (toAdd.length === 0) { showToast('参考画像は最大5枚です', 'error'); return; }

  let loaded = 0;
  const newImgs = [...existing];
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      newImgs.push({ base64: e.target.result.split(',')[1], mime: file.type || 'image/jpeg', name: file.name });
      loaded++;
      if (loaded === toAdd.length) {
        sections[idx].refImages = newImgs;
        sections[idx].refImageBase64 = null; // 旧形式クリア
        saveToStorage(); renderSectionList(); renderEditor();
        showToast(`✓ 参考画像を${toAdd.length}枚追加しました（合計${newImgs.length}枚）`, 'success');
      }
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function removeRefImageAt(idx, imgIdx) {
  const imgs = sections[idx].refImages || [];
  imgs.splice(imgIdx, 1);
  sections[idx].refImages = imgs;
  saveToStorage(); renderEditor(); renderSectionList();
  showToast('参考画像を削除しました');
}

function removeRefImage(idx) {
  sections[idx].refImages = [];
  sections[idx].refImageBase64 = null;
  sections[idx].refImageMime = null;
  sections[idx].refImageName = null;
  saveToStorage(); renderEditor();
  showToast('参考画像を削除しました');
}

// ─── Prompt builder ───
function buildFullPrompt(idx) {
  const s = sections[idx];
  const globalRules = getActiveGlobalRules();
  let parts = [];
  parts.push(`あなたは日本のトップクラス資格スクールのプロLPデザイナーです。以下の仕様に基づき、高品質なLP画像を生成してください。`);
  parts.push(`【共通スタイルルール・ブランドガイドライン】\n${globalRules}`);
  parts.push(`【このセクションの仕様】\n${s.prompt}`);
  if (s.customRules) parts.push(`【追加指示】\n${s.customRules}`);
  parts.push(`フォント：全てゴシック体（Noto Sans JP相当）で、日本語テキストを正確に描画してください。文字化け・崩れなし。重要数字はアクセントカラーで強調。CTAボタンは描画しないこと。`);
  return parts.join('\n\n');
}

function buildPromptPreview(idx) {
  alert('【送信されるプロンプト】\n\n' + buildFullPrompt(idx));
}

// ─── Image generation ───
async function generateImage(idx) {
  const apiKey = localStorage.getItem('lp_apikey') || '';
  if (!apiKey.startsWith('sk-')) { showToast('APIキーを設定してください', 'error'); showTab('settings-tab'); return; }
  if (!sections[idx].prompt.trim()) { showToast('プロンプトを入力してください', 'error'); return; }

  sections[idx].status = 'generating';
  saveToStorage(); renderSectionList(); renderEditor();

  const s = sections[idx];
  const prompt = buildFullPrompt(idx);
  const size = s.size || '1024x1536';
  const apiSize = size === '1792x256' ? '1536x1024' : size;

  try {
    let b64;

    // 参考画像の統合（新形式refImages優先、旧形式refImageBase64にも対応）
    const refImgs = s.refImages && s.refImages.length > 0 ? s.refImages
      : s.refImageBase64 ? [{ base64: s.refImageBase64, mime: s.refImageMime || 'image/jpeg', name: s.refImageName || '参考画像' }]
      : [];

    if (refImgs.length > 0) {
      // 参考画像あり → edits APIで送信
      const nameList = refImgs.map(r => r.name).join('、');
      const formData = new FormData();
      formData.append('model', 'gpt-image-1');
      formData.append('prompt', prompt + `\n\n【参考画像について】添付の参考画像（${nameList}）のレイアウト・構図・雰囲気を参考にしてデザインしてください。`);
      refImgs.forEach((img, i) => {
        const ext = img.mime.includes('png') ? 'png' : 'jpg';
        const byteChars = atob(img.base64);
        const byteArr = new Uint8Array(byteChars.length);
        for (let j = 0; j < byteChars.length; j++) byteArr[j] = byteChars.charCodeAt(j);
        formData.append('image[]', new File([byteArr], `ref${i+1}.${ext}`, { type: img.mime }));
      });
      formData.append('size', apiSize);
      formData.append('output_format', 'b64_json');
      formData.append('n', '1');

      const res = await fetch('https://api.openai.com/v1/images/edits', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}` },
        body: formData
      });
      if (!res.ok) { const err = await res.json(); throw new Error(err.error?.message || `HTTP ${res.status}`); }
      const data = await res.json();
      b64 = data.data?.[0]?.b64_json;
    } else {
      // 参考画像なし → generations API
      const res = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model: 'gpt-image-1', prompt, n: 1, size: apiSize, output_format: 'b64_json' })
      });
      if (!res.ok) { const err = await res.json(); throw new Error(err.error?.message || `HTTP ${res.status}`); }
      const data = await res.json();
      b64 = data.data?.[0]?.b64_json;
    }

    if (!b64) throw new Error('画像データが取得できませんでした');
    sections[idx].imageBase64 = b64;
    sections[idx].status = 'done';
    saveToStorage(); renderSectionList(); renderEditor();
    showToast(`✓ ${sections[idx].name} の生成完了！`, 'success');
  } catch(e) {
    sections[idx].status = 'pending';
    saveToStorage(); renderSectionList(); renderEditor();
    showToast('生成エラー: ' + e.message, 'error');
  }
}

function regenerateImage(idx) {
  if (!confirm('再生成しますか？現在の画像は上書きされます。')) return;
  sections[idx].imageBase64 = null;
  saveToStorage();
  generateImage(idx);
}

// ─── LP Preview ───
function renderLPPreview() {
  const container = document.getElementById('lpPreview');
  if (sections.length === 0) { container.innerHTML = `<div class="empty-state"><div class="icon">📄</div><div>セクションがありません</div></div>`; return; }
  container.innerHTML = sections.map((s, i) => {
    if (s.imageBase64) {
      const wrapClass = s.isBanner ? 'lp-section-wrap banner-wrap' : 'lp-section-wrap';
      return `<div class="${wrapClass}"><img class="lp-section-img" src="data:image/png;base64,${s.imageBase64}" alt="${escHtml(s.name)}"><div class="lp-section-overlay">${i+1}. ${escHtml(s.name)}</div></div>`;
    }
    return `<div class="lp-section-wrap"><div style="background:var(--surface2);border:2px dashed var(--border);padding:40px;text-align:center;color:var(--text2);max-width:390px;width:100%">${i+1}. ${escHtml(s.name)} — 未生成</div></div>`;
  }).join('');
}

// ─── Export ───
function exportLP() {
  const hasSections = sections.some(s => s.imageBase64);
  if (!hasSections) { showToast('生成済みの画像がありません', 'error'); return; }
  const imagesHtml = sections.map((s, i) => {
    if (!s.imageBase64) return `<!-- ${i+1}. ${s.name} - 未生成 -->`;
    return `  <!-- ${i+1}. ${s.name} -->\n  <img src="data:image/png;base64,${s.imageBase64}" alt="${escHtml(s.name)}" style="width:100%;display:block;">`;
  }).join('\n');
  const html = `<!DOCTYPE html>\n<html lang="ja">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1.0">\n  <title>資料請求LP</title>\n  <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;max-width:390px;margin:0 auto}img{width:100%;display:block}</style>\n</head>\n<body>\n${imagesHtml}\n</body>\n</html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'lp-export.html'; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ HTMLをエクスポートしました', 'success');
}

function exportData() {
  const data = { version: 2, globalRules: localStorage.getItem('lp_globalrules') || '', sections };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `lp-project-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ プロジェクトを保存しました', 'success');
}

function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.sections) {
        if (!confirm(`${data.sections.length}件をインポートします。現在のデータは上書きされます。`)) return;
        sections = data.sections;
        if (data.globalRules) { localStorage.setItem('lp_globalrules', data.globalRules); document.getElementById('globalRules').value = data.globalRules; }
        saveToStorage(); activeIdx = null; renderSectionList(); renderEditor();
        showToast(`✓ ${sections.length}件をインポートしました`, 'success');
      }
    } catch(err) { showToast('インポートエラー', 'error'); }
  };
  reader.readAsText(file); e.target.value = '';
}

function clearAll() {
  if (!confirm('全セクションを削除しますか？')) return;
  sections = []; activeIdx = null; saveToStorage(); renderSectionList(); renderEditor();
  showToast('全セクションを削除しました');
}

// ─── UI helpers ───
function showTab(id) {
  document.querySelectorAll('.panel-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById(id + '-btn').classList.add('active');
}
function showMainView(id) {
  document.getElementById('editor-view').style.display = id === 'editor-view' ? 'flex' : 'none';
  document.getElementById('lp-preview-view').style.display = id === 'lp-preview-view' ? 'flex' : 'none';
  if (id === 'lp-preview-view') renderLPPreview();
}
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}
function escHtml(str) { if (!str) return ''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
