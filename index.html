<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP Prompt Builder</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #DC0107;
    --accent2: #FF422E;
    --text: #e8e6f0;
    --text2: #9591a8;
    --success: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 10px;
    --font: 'Inter', 'Hiragino Sans', 'Meiryo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 15px; font-weight: 700; }
  header h1 span { color: var(--accent2); }

  .layout { display: grid; grid-template-columns: 300px 1fr 360px; height: calc(100vh - 56px); overflow: hidden; }

  /* Left */
  .left { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .left-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ltab { flex: 1; padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; transition: all .2s; }
  .ltab.active { color: var(--accent2); border-bottom-color: var(--accent); }
  .left-body { flex: 1; overflow-y: auto; padding: 14px; }
  .left-content { display: none; }
  .left-content.active { display: block; }

  /* Middle */
  .middle { display: flex; flex-direction: column; overflow: hidden; }
  .mid-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .mid-header h2 { font-size: 14px; font-weight: 700; }
  .mid-body { flex: 1; overflow-y: auto; padding: 20px; }

  /* Right - Output */
  .right { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .right-header { padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .right-header h2 { font-size: 14px; font-weight: 700; }
  .prompt-output { flex: 1; overflow-y: auto; padding: 16px; }
  .prompt-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-size: 12px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-word; min-height: 200px; }
  .prompt-layer { margin-bottom: 16px; }
  .prompt-layer-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; padding: 3px 8px; border-radius: 4px; display: inline-block; }
  .layer1-label { background: rgba(220,1,7,.2); color: #FF9589; }
  .layer2-label { background: rgba(255,66,46,.2); color: #FFB4A2; }
  .layer3-label { background: rgba(74,222,128,.15); color: var(--success); }
  .prompt-text { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  input[type="text"], input[type="color"], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 13px; padding: 9px 12px; transition: border-color .2s; outline: none; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 70px; line-height: 1.5; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }
  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-row input[type="color"] { width: 40px; height: 36px; padding: 2px; cursor: pointer; border-radius: 6px; }
  .color-row input[type="text"] { flex: 1; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn-success { background: var(--success); color: #000; font-weight: 700; }
  .btn-success:hover { opacity: .85; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid transparent; }
  .btn-danger:hover { border-color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-full { width: 100%; }

  /* Section list */
  .section-list { display: flex; flex-direction: column; gap: 6px; }
  .section-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 8px; }
  .section-card:hover { border-color: var(--accent); }
  .section-card.active { border-color: var(--accent); background: rgba(220,1,7,.08); }
  .section-num { width: 20px; height: 20px; background: var(--accent); color: #fff; border-radius: 50%; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .section-card-name { font-size: 12px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
  .section-card:hover .section-card-actions { opacity: 1; }

  /* Layer badges */
  .layer-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; display: inline-block; margin-bottom: 10px; }
  .badge-l1 { background: rgba(220,1,7,.2); color: #FF9589; }
  .badge-l2 { background: rgba(255,66,46,.2); color: #FFB4A2; }
  .badge-l3 { background: rgba(74,222,128,.15); color: var(--success); }

  /* Segment */
  .segment { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .segment h3 { font-size: 11px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

  /* Tags */
  .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; min-height: 44px; cursor: text; }
  .tag-input-wrap:focus-within { border-color: var(--accent); }
  .tag { background: rgba(220,1,7,.2); color: #FF9589; border-radius: 4px; padding: 2px 8px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .tag-del { cursor: pointer; opacity: .7; }
  .tag-del:hover { opacity: 1; }
  .tag-input { background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; min-width: 80px; flex: 1; }

  /* Copy button */
  .copy-btn { position: relative; }
  .copy-confirm { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .copy-confirm.show { opacity: 1; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 9999; transition: transform .3s; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .hint { font-size: 11px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>LP <span>Prompt Builder</span></h1>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost btn-sm" onclick="exportProject()">💾 保存</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">📂 読込</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProject(event)">
  </div>
</header>

<div class="layout">

  <!-- Left: Navigation -->
  <div class="left">
    <div class="left-tabs">
      <div class="ltab active" onclick="showLTab('sections-tab')" id="sections-tab-btn">📋 セクション</div>
      <div class="ltab" onclick="showLTab('presets-tab')" id="presets-tab-btn">⚡ 追加</div>
    </div>
    <div class="left-body">
      <!-- Sections -->
      <div class="left-content active" id="sections-tab">
        <button class="btn btn-primary btn-full btn-sm" style="margin-bottom:12px" onclick="addBlankSection()">＋ セクション追加</button>
        <div class="section-list" id="sectionList">
          <div class="empty-state">セクションを追加してください</div>
        </div>
      </div>
      <!-- Presets -->
      <div class="left-content" id="presets-tab">
        <div class="segment">
          <h3>⚡ 資料請求LP 標準構成</h3>
          <p class="hint" style="margin-bottom:10px">よく使うセクション構成を一括追加</p>
          <button class="btn btn-primary btn-full btn-sm" onclick="loadPresets()">全セクションを一括追加</button>
        </div>
        <div class="segment">
          <h3>個別追加</h3>
          <div id="presetBtns"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Middle: Editor -->
  <div class="middle">
    <div class="mid-header">
      <h2 id="midTitle">Layer 1：基本ルールを確認・編集</h2>
      <div style="display:flex;gap:6px" id="sectionControls" style="display:none">
        <button class="btn btn-ghost btn-sm" id="moveUpBtn" onclick="moveSection(-1)" disabled>↑</button>
        <button class="btn btn-ghost btn-sm" id="moveDownBtn" onclick="moveSection(1)" disabled>↓</button>
        <button class="btn btn-danger btn-sm" id="delSectionBtn" onclick="deleteSection()" disabled>削除</button>
      </div>
    </div>
    <div class="mid-body" id="midBody">
      <!-- default: Layer1 view -->
    </div>
  </div>

  <!-- Right: Prompt Output -->
  <div class="right">
    <div class="right-header">
      <h2>📋 生成プロンプト</h2>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="copyAll()">全体コピー</button>
        <button class="btn btn-success btn-sm" onclick="copyActive()">選択中をコピー</button>
      </div>
    </div>
    <div class="prompt-output" id="promptOutput">
      <div class="empty-state">左でセクションを選ぶとプロンプトが表示されます</div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ─── Default Layer 1 ───
const DEFAULT_L1 = {
  role: `あなたは「スマホLPデザインの専門家」兼「OpenAI画像生成モデルを熟知したプロフェッショナル」です。私が渡す情報をもとに、各セクションの高品質なLP画像を生成してください。`,
  imageRules: `- アスペクト比：スマホサイズの縦長「9:16」（追従CTAバナーのみ横長5:1）
- 品質：日本のトップクラス資格スクール／SaaSのプロデザイナーが2025年に制作した情報密度の高いプレミアムLPデザイン
- 各セクションが単独でステークホルダーレビューに耐える完成度
- フォント：全てゴシック体（Noto Sans JP相当）で日本語テキストを正確に描画
- 重要数字（％、円、ヶ月等）はアクセントカラーで強調
- 写真スタイル：実写ベース（合格者・講師は本物の表情）
- グラフ：清潔感のあるフラットデザイン`,
  prohibited: `- スカスカ・余白だけのスライド表紙的構成
- 背景の過度な装飾
- PowerPoint素材・無料テンプレート風
- ストックフォト的な切り抜き合成感
- チープな円グラフ・棒グラフ
- 明朝体・サンセリフ系フォント
- 過剰な宣伝広告風`,
  ctaRule: `【画像内に描画しない要素】
- ボタン形状の図形（角丸矩形、押せそうな箱）
- 行動喚起テキスト（「資料請求はこちら」「今すぐ申し込む」等）
- ボタンを示唆する矢印アイコンや押下エフェクト

【画像内に描画してよい要素】
- 見出し・サブ見出し・説明文・吹き出し・体験談
- 訴求数字・統計・商品名・価格・キャンペーン文言
- STEP表記（STEP01〜03等）`,
  other: ``
};

// ─── Section Presets ───
const SECTION_PRESETS = [
  { name: 'FV（ファストビュー）', type: 'hero',
    purpose: 'LPの第一印象。商品名・最強の数字訴求・ターゲットの共感を一目で伝える',
    visual: '30〜40代女性、知的な雰囲気、教材を胸元に抱えカメラ目線、オフィスカジュアル、明るい室内背景',
    texts: '商品名、メインキャッチコピー（合格率など最強数字）、サブコピー、価格帯、最短期間',
    notes: '数字は最大サイズで強調。下部に3つのアイコン付き訴求エリアを配置' },
  { name: '合格率比較', type: 'comparison',
    purpose: '競合との数字比較でフォーサイトの優位性を視覚的に証明する',
    visual: 'フラットデザインのドーナツグラフ2つを並べて対比（全国平均vs自社）',
    texts: '見出し、全国平均の数字、自社の合格率、倍率（4.0倍！）、注釈',
    notes: '2つのグラフの大きさで差を表現。倍率を特大文字で中央に配置' },
  { name: '不安解消＆強み', type: 'feature',
    purpose: 'ターゲットの3大不安を解消し、自社の強みを伝える',
    visual: '悩む人物×3パターン（不安→解決の流れを3セットで構成）',
    texts: '各不安文言、各解決文言、まとめキャッチコピー',
    notes: '不安→解決の矢印フローを3セット縦に配置' },
  { name: '資料請求特典', type: 'benefit',
    purpose: '資料請求のハードルを下げる特典を魅力的に見せる',
    visual: '特典3点をカード形式で表示（アイコン付き）',
    texts: '見出し、特典①②③の名前と説明',
    notes: '各特典カードにアクセントカラーのライン' },
  { name: '資料請求割引', type: 'discount',
    purpose: '資料請求で得られる金額メリットを強調する',
    visual: '割引金額を大きく中央に配置、価格比較（通常→割引後）',
    texts: '見出し、割引金額（10,000円割引等）、注釈、価格例',
    notes: '通常価格に打ち消し線、割引後価格をレッドで強調' },
  { name: '実績訴求', type: 'achievement',
    purpose: '累計受講者数など実績数字で信頼感を高める',
    visual: 'スーツ姿の男性（自信に満ちた表情）と大きな数字',
    texts: '見出し、サブ、累計受講者数など実績数字',
    notes: '数字を特大で中央配置' },
  { name: 'CTA（中間）', type: 'cta',
    purpose: 'スクロール中盤での行動喚起。前向きな気持ちを高める',
    visual: 'レッド系背景または明るい背景、達成感のある雰囲気',
    texts: '見出し、講座名（強調）、サブコピー',
    notes: 'CTAボタンは描画しない。ボタン設置用の余白を下部に確保' },
  { name: '3つの教材', type: 'feature',
    purpose: '教材の特徴を具体的に伝え、学習イメージを持たせる',
    visual: '3つの教材を番号付きで縦に配置（テキスト・eラーニング・講義）',
    texts: '見出し、各教材の番号・名前・説明・POINT',
    notes: '番号（01/02/03）をレッドで強調' },
  { name: '安心保証', type: 'guarantee',
    purpose: '購入リスクをゼロにする保証制度を伝える',
    visual: '2つの保証をカード形式で並列表示（盾アイコン付き）',
    texts: '見出し、各保証の名前・内容・対象プラン、注釈',
    notes: '安心感を与えるデザイン' },
  { name: '講師紹介', type: 'profile',
    purpose: '講師の顔を見せることで信頼感と親近感を高める',
    visual: '講師2名の人物写真エリア（スーツ・笑顔）',
    texts: '見出し、各講師の名前・肩書き・キャッチコピー',
    notes: '各講師カードにレッドのアクセント' },
  { name: '合格者インタビュー', type: 'testimonial',
    purpose: '実際の合格者の声でリアルな信頼感を高める',
    visual: '合格証書を持った合格者の写真（自然な笑顔・達成感）',
    texts: '見出し、インタビュータイトル、属性、本文（吹き出し風）',
    notes: 'スライダーインジケーター（ドット表示）で複数枚あることを示す' },
  { name: '料金プラン', type: 'price',
    purpose: '3つのプランを比較しやすく見せ、上位プランへ誘導する',
    visual: '3つのプランカードを縦に配置（1番人気を強調）',
    texts: '見出し、各プラン名・内容・価格・保証、教育訓練給付制度バッジ',
    notes: '1番人気プランを視覚的に目立たせる' },
  { name: '合格特典', type: 'bonus',
    purpose: '合格後のメリットを示してモチベーションを高める',
    visual: 'お祝い感のある明るいデザイン（トロフィーアイコン）',
    texts: '見出し、各プランのお祝い金・報奨金、注釈',
    notes: 'ゴールド×レッドのアクセント' },
  { name: '申込み導線', type: 'flow',
    purpose: '申込みの流れをSTEPで示してハードルを下げる',
    visual: 'STEP01〜03のフロー図、特典3点の再掲',
    texts: '見出し、割引金額、STEP01〜03の説明、特典内容、注釈',
    notes: 'CTAボタンは描画しない' },
  { name: 'クロージング', type: 'closing',
    purpose: '最後の後押し。FVと同じ人物で一貫性を持たせる',
    visual: 'FVと同じ女性（笑顔・前向き）',
    texts: '見出し、累計受講者数、キャッチコピー',
    notes: 'CTAボタンは描画しない。ボタン用余白を下部に確保' },
  { name: '追従CTAバナー', type: 'cta_banner',
    purpose: 'スマホ画面下部に固定表示する横長バナー',
    visual: '横長バナー（5:1比率）、白背景＋上端に影、ブラック系角丸ボタン形状',
    texts: 'ボタン内テキスト「資料請求はこちら」、補助テキスト「カンタン1分で完了 ▶」',
    notes: '全セクションとの配色トーン統一' },
];

// ─── State ───
let layer1 = { ...DEFAULT_L1 };
let layer2 = {
  productName: '',
  productDesc: '',
  targetAge: '',
  targetJob: '',
  targetWorries: [],
  colorMain: '#DC0107',
  colorSub: '#FF422E',
  colorAccent: '#FF9589',
  colorBg: '#E7E7E7',
  colorText: '#333333',
  toneWords: [],
  toneNG: [],
  strengths: [],
  notes: ''
};
let sections = [];
let activeView = 'layer1'; // 'layer1' | 'layer2' | section index

// ─── Init ───
window.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  renderAll();
  showView('layer1');
  renderPresetBtns();
});

function renderAll() {
  renderSectionList();
  renderPromptOutput();
}

// ─── Storage ───
function loadFromStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('lp_pb_data') || '{}');
    if (d.layer1 && typeof d.layer1 === 'object') layer1 = { ...DEFAULT_L1, ...d.layer1 };
    if (d.layer2) layer2 = { ...layer2, ...d.layer2 };
    if (d.sections) sections = d.sections;
  } catch(e) {}
}
function saveToStorage() {
  localStorage.setItem('lp_pb_data', JSON.stringify({ layer1, layer2, sections }));
}

// ─── Views ───
function showView(view) {
  activeView = view;
  const body = document.getElementById('midBody');
  const title = document.getElementById('midTitle');
  const ctrl = document.getElementById('sectionControls');

  document.getElementById('moveUpBtn').disabled = true;
  document.getElementById('moveDownBtn').disabled = true;
  document.getElementById('delSectionBtn').disabled = true;

  if (view === 'layer1') {
    title.textContent = 'Layer 1：基本ルール（全LP共通）';
    ctrl.style.display = 'none';
    body.innerHTML = renderLayer1Form();
    renderSectionList();
    renderPromptOutput();
  } else if (view === 'layer2') {
    title.textContent = 'Layer 2：LP個別設定';
    ctrl.style.display = 'none';
    body.innerHTML = renderLayer2Form();
    initTagInputs();
    renderSectionList();
    renderPromptOutput();
  } else {
    const idx = parseInt(view);
    const s = sections[idx];
    title.textContent = `Layer 3：${idx+1}. ${s.name}`;
    ctrl.style.display = 'flex';
    document.getElementById('moveUpBtn').disabled = idx === 0;
    document.getElementById('moveDownBtn').disabled = idx === sections.length - 1;
    document.getElementById('delSectionBtn').disabled = false;
    body.innerHTML = renderSectionForm(idx);
    renderSectionList();
    renderPromptOutput();
  }
}

// ─── Tag inputs ───
function initTagInputs() {}
function handleTagInput(e, field) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim();
    if (val && !layer2[field].includes(val)) {
      layer2[field].push(val);
      saveToStorage();
      showView('layer2');
    }
    e.target.value = '';
  }
}
function removeTag(field, val) {
  layer2[field] = layer2[field].filter(t => t !== val);
  saveToStorage();
  showView('layer2');
}

// ─── Section management ───
function addBlankSection() {
  sections.push({ name: `セクション ${sections.length+1}`, type: 'custom', purpose: '', visual: '', texts: '', notes: '' });
  saveToStorage();
  showView(sections.length - 1);
  showLTab('sections-tab');
}
function addPresetSection(idx) {
  const p = SECTION_PRESETS[idx];
  sections.push({ name: p.name, type: p.type, purpose: p.purpose, visual: p.visual, texts: p.texts, notes: p.notes });
  saveToStorage();
  showView(sections.length - 1);
  showLTab('sections-tab');
  showToast(`✓ ${p.name} を追加しました`, 'success');
}
function loadPresets() {
  if (sections.length > 0 && !confirm('現在のセクションに追加しますか？')) return;
  SECTION_PRESETS.forEach(p => {
    sections.push({ name: p.name, type: p.type, purpose: p.purpose, visual: p.visual, texts: p.texts, notes: p.notes });
  });
  saveToStorage();
  showView(0);
  showLTab('sections-tab');
  showToast(`✓ ${SECTION_PRESETS.length}件を追加しました`, 'success');
}
function deleteSection() {
  const idx = parseInt(activeView);
  if (isNaN(idx)) return;
  if (!confirm(`「${sections[idx].name}」を削除しますか？`)) return;
  sections.splice(idx, 1);
  saveToStorage();
  showView(sections.length > 0 ? Math.min(idx, sections.length-1) : 'layer1');
}
function moveSection(dir) {
  const idx = parseInt(activeView);
  if (isNaN(idx)) return;
  const n = idx + dir;
  if (n < 0 || n >= sections.length) return;
  [sections[idx], sections[n]] = [sections[n], sections[idx]];
  saveToStorage();
  showView(n);
}

// ─── Render section list ───
function renderSectionList() {
  const list = document.getElementById('sectionList');
  if (sections.length === 0) {
    list.innerHTML = '<div class="empty-state">セクションを追加してください</div>';
    return;

    <div class="section-card ${activeView==='layer1'?'active':''}" onclick="showView('layer1')" style="background:rgba(220,1,7,.06)">

      <div class="section-num" style="background:#FF422E">L2</div>
      <div class="section-card-name">LP個別設定${layer2.productName ? '：'+layer2.productName : ''}</div>
    </div>
    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
    ${sections.map((s,i) => `

function renderPresetBtns() {
  document.getElementById('presetBtns').innerHTML = SECTION_PRESETS.map((p,i) =>

// ─── Prompt builder ───
function buildLayer2Text() {
  const l = layer2;
  let parts = [];
  if (l.productName) parts.push(`商品名：${l.productName}`);
  if (l.productDesc) parts.push(`内容・特徴：${l.productDesc}`);
  if (l.strengths.length) parts.push(`訴求数字・強み：${l.strengths.join('　')}`);
  if (l.targetAge || l.targetJob) parts.push(`ターゲット：${[l.targetAge, l.targetJob].filter(Boolean).join('、')}`);
  if (l.targetWorries.length) parts.push(`ターゲットの悩み：${l.targetWorries.join('　')}`);
  parts.push(`カラーパレット：メイン${l.colorMain}　サブ${l.colorSub}　アクセント${l.colorAccent}　背景${l.colorBg}　テキスト${l.colorText}`);
  if (l.toneWords.length) parts.push(`トンマナ：${l.toneWords.join('　')}`);
  if (l.toneNG.length) parts.push(`使用NG：${l.toneNG.join('　')}`);
  if (l.notes) parts.push(`補足：${l.notes}`);
  return parts.join('\n');
}

function buildSectionText(s) {
  let parts = [];
  if (s.purpose) parts.push(`【目的】${s.purpose}`);
  if (s.visual) parts.push(`【ビジュアル】${s.visual}`);
  if (s.texts) parts.push(`【画像内テキスト】\n${s.texts}`);
  if (s.notes) parts.push(`【補足・注意】${s.notes}`);
  return parts.join('\n\n');
}

function buildLayer1Text() {
  const l = layer1;
  let parts = [];
  if (l.role) parts.push(`【役割】\n${l.role}`);
  if (l.imageRules) parts.push(`【画像生成ルール】\n${l.imageRules}`);
  if (l.prohibited) parts.push(`【禁止事項】\n${l.prohibited}`);
  if (l.ctaRule) parts.push(`【CTAボタン非描画ルール】\n${l.ctaRule}`);
  if (l.other) parts.push(`【補足】\n${l.other}`);
  return parts.join('\n\n');
}

function buildFullPrompt(sectionIdx) {
  const s = sections[sectionIdx];
  return `${buildLayer1Text()}\n\n${'─'.repeat(40)}\n【LP情報】\n${buildLayer2Text()}\n\n${'─'.repeat(40)}\n【セクション：${s.name}】\n${buildSectionText(s)}`;
}

// ─── Render prompt output ───
function renderPromptOutput() {
  const out = document.getElementById('promptOutput');
  if (activeView === 'layer1') {
    out.innerHTML = `
      <div class="prompt-layer">
        <div class="prompt-layer-label layer1-label">Layer 1 — 基本ルール</div>
        <div class="prompt-text">${escHtml(buildLayer1Text())}</div>
      </div>`;
  } else if (activeView === 'layer2') {
    out.innerHTML = `
      <div class="prompt-layer">
        <div class="prompt-layer-label layer2-label">Layer 2 — LP個別設定</div>
        <div class="prompt-text">${escHtml(buildLayer2Text()) || '（未入力）'}</div>
      </div>`;
  } else {
    const idx = parseInt(activeView);
    if (isNaN(idx) || !sections[idx]) return;
    const s = sections[idx];
    out.innerHTML = `
      <div class="prompt-layer">
        <div class="prompt-layer-label layer1-label">Layer 1</div>
        <div class="prompt-text" style="max-height:120px;overflow:hidden;position:relative">
          ${escHtml(buildLayer1Text().substring(0,200))}...
          <div style="position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--bg))"></div>
        </div>
      </div>
      <div class="prompt-layer">
        <div class="prompt-layer-label layer2-label">Layer 2</div>
        <div class="prompt-text">${escHtml(buildLayer2Text()) || '（LP個別設定が未入力です）'}</div>
      </div>
      <div class="prompt-layer">
        <div class="prompt-layer-label layer3-label">Layer 3 — ${escHtml(s.name)}</div>
        <div class="prompt-text">${escHtml(buildSectionText(s)) || '（セクション内容が未入力です）'}</div>
      </div>`;
  }
}

// ─── Copy ───
function copyActive() {
  let text = '';
  if (activeView === 'layer1') text = buildLayer1Text();
  else if (activeView === 'layer2') text = buildLayer2Text();
  else {
    const idx = parseInt(activeView);
    if (!isNaN(idx)) text = buildFullPrompt(idx);
  }
  navigator.clipboard.writeText(text).then(() => showToast('✓ コピーしました！ChatGPTに貼り付けてください', 'success'));
}
function copyAll() {
  const all = sections.map((s,i) => `【セクション${i+1}：${s.name}】\n${buildFullPrompt(i)}`).join('\n\n' + '═'.repeat(50) + '\n\n');
  navigator.clipboard.writeText(all || layer1).then(() => showToast('✓ 全プロンプトをコピーしました', 'success'));
}

// ─── Export/Import ───
function exportProject() {
  const data = { layer1, layer2, sections };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `lp-prompt-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ 保存しました', 'success');
}
function importProject(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.layer1) layer1 = d.layer1;
      if (d.layer2) layer2 = { ...layer2, ...d.layer2 };
      if (d.sections) sections = d.sections;
      saveToStorage(); renderAll(); showView('layer2');
      showToast('✓ 読み込みました', 'success');
    } catch(err) { showToast('読み込みエラー', 'error'); }
  };
  reader.readAsText(file); e.target.value = '';
}

// ─── UI helpers ───
function showLTab(id) {
  document.querySelectorAll('.left-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.ltab').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById(id + '-btn').classList.add('active');
}
let toastTimer;
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show' + (type?' '+type:'');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className='', 3000);
}
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
