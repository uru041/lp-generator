<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP セクション生成ツール</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6aff;
    --accent2: #a594ff;
    --text: #e8e6f0;
    --text2: #9591a8;
    --success: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 10px;
    --font: 'Inter', 'Hiragino Sans', 'Meiryo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .03em; }
  header h1 span { color: var(--accent2); }
  .header-actions { display: flex; gap: 8px; }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 56px);
  }

  /* ── Left Panel ── */
  .left-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text2);
    transition: all .2s;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--accent2);
    border-bottom-color: var(--accent);
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .panel-content { display: none; }
  .panel-content.active { display: block; }

  /* ── Form elements ── */
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 9px 12px;
    transition: border-color .2s;
    outline: none;
    resize: vertical;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 80px; line-height: 1.5; }
  .form-group { margin-bottom: 14px; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid transparent; }
  .btn-danger:hover { border-color: var(--danger); background: rgba(248,113,113,.1); }
  .btn-success { background: var(--success); color: #000; }
  .btn-success:hover { opacity: .85; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-full { width: 100%; }

  /* ── Section list ── */
  .section-list { display: flex; flex-direction: column; gap: 8px; }
  .section-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
  }
  .section-card:hover { border-color: var(--accent); }
  .section-card.active { border-color: var(--accent); background: rgba(124,106,255,.08); }
  .section-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .section-number {
    width: 22px;
    height: 22px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .section-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-status {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
  }
  .status-done { background: rgba(74,222,128,.15); color: var(--success); }
  .status-pending { background: rgba(251,191,36,.12); color: var(--warn); }
  .status-generating { background: rgba(124,106,255,.15); color: var(--accent2); }
  .section-prompt-preview { font-size: 11px; color: var(--text2); margin-top: 6px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .section-actions { display: flex; gap: 4px; margin-top: 8px; }
  .drag-handle { cursor: grab; color: var(--text2); padding: 2px; }

  /* ── Right Panel ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .right-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .right-header h2 { font-size: 14px; font-weight: 700; }
  .right-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* ── Editor ── */
  .editor-pane {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .editor-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  /* ── Preview ── */
  .preview-pane {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    overflow-y: auto;
  }
  .preview-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .06em;
    align-self: flex-start;
  }
  .preview-img-wrap {
    width: 100%;
    max-width: 600px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
  }
  .preview-img-wrap img {
    width: 100%;
    display: block;
  }
  .preview-placeholder {
    width: 100%;
    max-width: 600px;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    color: var(--text2);
    gap: 8px;
    font-size: 13px;
  }
  .preview-placeholder .icon { font-size: 32px; }

  /* ── LP Preview (full) ── */
  .lp-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 0;
  }
  .lp-section-img {
    width: 100%;
    max-width: 600px;
    display: block;
  }
  .lp-section-wrap { width: 100%; max-width: 600px; position: relative; }
  .lp-section-overlay {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  /* ── Generating spinner ── */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    z-index: 9999;
    transition: transform .3s;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* ── Settings ── */
  .settings-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .settings-section h3 { font-size: 12px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .api-status { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-ok { background: var(--success); }
  .dot-ng { background: var(--danger); }

  /* ── Size selector ── */
  .size-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .size-opt {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    transition: all .2s;
    font-size: 12px;
  }
  .size-opt.active { border-color: var(--accent); background: rgba(124,106,255,.1); color: var(--accent2); }
  .size-opt .size-ratio { font-size: 18px; margin-bottom: 2px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .badge { font-size: 10px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 10px; font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>LP <span>Section</span> Generator</h1>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="showTab('settings-tab')">⚙ 設定</button>
    <button class="btn btn-ghost btn-sm" onclick="showMainView('lp-preview-view')">🖥 LPプレビュー</button>
    <button class="btn btn-success btn-sm" onclick="exportLP()">⬇ エクスポート</button>
  </div>
</header>

<div class="layout">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="panel-tabs">
      <div class="tab active" onclick="showTab('sections-tab')" id="sections-tab-btn">📋 セクション</div>
      <div class="tab" onclick="showTab('settings-tab')" id="settings-tab-btn">⚙ 設定</div>
    </div>
    <div class="panel-body">
      <!-- Sections Tab -->
      <div class="panel-content active" id="sections-tab">
        <button class="btn btn-primary btn-full" style="margin-bottom:14px" onclick="addSection()">＋ セクション追加</button>
        <div class="section-list" id="sectionList">
          <div class="empty-state">
            <div class="icon">📄</div>
            <div>セクションを追加して<br>LP制作を始めましょう</div>
          </div>
        </div>
      </div>
      <!-- Settings Tab -->
      <div class="panel-content" id="settings-tab">
        <div class="settings-section">
          <h3>🔑 API設定</h3>
          <div class="form-group">
            <label>OpenAI APIキー</label>
            <input type="password" id="apiKeyInput" placeholder="sk-..." oninput="saveApiKey()">
            <div class="api-status" id="apiStatus">
              <div class="dot dot-ng" id="apiDot"></div>
              <span id="apiStatusText">未設定</span>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <h3>📐 画像サイズ</h3>
          <div class="size-grid" id="sizeGrid">
            <div class="size-opt active" onclick="selectSize('1536x1024','横長 (1536×1024)')" data-size="1536x1024">
              <div class="size-ratio">⬛</div>横長
            </div>
            <div class="size-opt" onclick="selectSize('1024x1536','縦長 (1024×1536)')" data-size="1024x1536">
              <div class="size-ratio">▮</div>縦長
            </div>
            <div class="size-opt" onclick="selectSize('1024x1024','正方形 (1024×1024)')" data-size="1024x1024">
              <div class="size-ratio">■</div>正方形
            </div>
          </div>
          <p style="font-size:11px; color:var(--text2); margin-top:8px">現在: <span id="sizeLabel">横長 (1536×1024)</span></p>
        </div>
        <div class="settings-section">
          <h3>🎨 共通ルール</h3>
          <div class="form-group">
            <label>全セクションに適用するスタイルルール</label>
            <textarea id="globalRules" rows="6" placeholder="例：
・ブランドカラー: #1A2E5A（ネイビー）、#F4A300（ゴールド）
・フォント: モダンなサンセリフ
・トンマナ: 高級感・信頼感
・写真スタイル: リアル写真 / イラスト不可
・必ずロゴエリアを左上に配置" oninput="saveGlobalRules()"></textarea>
          </div>
          <button class="btn btn-ghost btn-full btn-sm" onclick="applyGlobalRulesToAll()">全セクションに再適用</button>
        </div>
        <div class="settings-section">
          <h3>📦 データ管理</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="exportData()">💾 JSONエクスポート</button>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">📂 JSONインポート</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑 全削除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel" id="rightPanel">
    <!-- Editor View -->
    <div id="editor-view" style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div class="right-header">
        <h2 id="editorTitle">セクションを選択してください</h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" id="moveUpBtn" onclick="moveSection(-1)" disabled>↑</button>
          <button class="btn btn-ghost btn-sm" id="moveDownBtn" onclick="moveSection(1)" disabled>↓</button>
          <button class="btn btn-danger btn-sm" id="deleteSectionBtn" onclick="deleteSection()" disabled>削除</button>
        </div>
      </div>
      <div class="right-body">
        <div class="editor-pane" id="editorPane">
          <div class="empty-state">
            <div class="icon">👈</div>
            <div>左のリストからセクションを選ぶか<br>「＋ セクション追加」で始めましょう</div>
          </div>
        </div>
        <div class="preview-pane" id="previewPane" style="display:none">
          <div class="preview-label">生成結果プレビュー</div>
          <div id="imgContainer"></div>
        </div>
      </div>
    </div>

    <!-- LP Full Preview View -->
    <div id="lp-preview-view" style="display:none;flex-direction:column;height:100%;overflow:hidden">
      <div class="right-header">
        <h2>🖥 LP全体プレビュー</h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="showMainView('editor-view')">← 編集に戻る</button>
          <button class="btn btn-success btn-sm" onclick="exportLP()">⬇ エクスポート</button>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto">
        <div class="lp-preview" id="lpPreview"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let sections = [];
let activeIdx = null;
let selectedSize = '1536x1024';
let selectedSizeLabel = '横長 (1536×1024)';

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  const key = localStorage.getItem('lp_apikey') || '';
  document.getElementById('apiKeyInput').value = key;
  updateApiStatus(key);
  const rules = localStorage.getItem('lp_globalrules') || '';
  document.getElementById('globalRules').value = rules;
  const sz = localStorage.getItem('lp_size');
  if (sz) {
    const lbl = localStorage.getItem('lp_size_label') || sz;
    selectSize(sz, lbl);
  }
  renderSectionList();
});

// ─────────────────────────────────────────────
// Persistence
// ─────────────────────────────────────────────
function loadFromStorage() {
  try {
    const raw = localStorage.getItem('lp_sections');
    if (raw) sections = JSON.parse(raw);
  } catch(e) { sections = []; }
}
function saveToStorage() {
  localStorage.setItem('lp_sections', JSON.stringify(sections));
}
function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('lp_apikey', key);
  updateApiStatus(key);
}
function updateApiStatus(key) {
  const ok = key.startsWith('sk-') && key.length > 20;
  document.getElementById('apiDot').className = 'dot ' + (ok ? 'dot-ok' : 'dot-ng');
  document.getElementById('apiStatusText').textContent = ok ? '設定済み' : '未設定';
}
function saveGlobalRules() {
  localStorage.setItem('lp_globalrules', document.getElementById('globalRules').value);
}
function selectSize(size, label) {
  selectedSize = size;
  selectedSizeLabel = label;
  localStorage.setItem('lp_size', size);
  localStorage.setItem('lp_size_label', label);
  document.querySelectorAll('.size-opt').forEach(el => {
    el.classList.toggle('active', el.dataset.size === size);
  });
  document.getElementById('sizeLabel').textContent = label;
}

// ─────────────────────────────────────────────
// Section management
// ─────────────────────────────────────────────
function addSection() {
  const idx = sections.length + 1;
  const section = {
    id: Date.now(),
    name: `セクション ${idx}`,
    sectionType: 'hero',
    prompt: '',
    customRules: '',
    imageUrl: null,
    imageBase64: null,
    status: 'pending'
  };
  sections.push(section);
  saveToStorage();
  renderSectionList();
  selectSection(sections.length - 1);
  showTab('sections-tab');
}

function deleteSection() {
  if (activeIdx === null) return;
  if (!confirm(`「${sections[activeIdx].name}」を削除しますか？`)) return;
  sections.splice(activeIdx, 1);
  activeIdx = null;
  saveToStorage();
  renderSectionList();
  renderEditor();
}

function moveSection(dir) {
  if (activeIdx === null) return;
  const newIdx = activeIdx + dir;
  if (newIdx < 0 || newIdx >= sections.length) return;
  [sections[activeIdx], sections[newIdx]] = [sections[newIdx], sections[activeIdx]];
  activeIdx = newIdx;
  saveToStorage();
  renderSectionList();
  renderEditor();
}

function selectSection(idx) {
  activeIdx = idx;
  renderSectionList();
  renderEditor();
}

const SECTION_TYPES = [
  { value: 'hero', label: 'ヒーロー（メインビジュアル）' },
  { value: 'feature', label: '特徴・機能紹介' },
  { value: 'benefit', label: 'ベネフィット・強み' },
  { value: 'testimonial', label: 'お客様の声' },
  { value: 'flow', label: '利用の流れ' },
  { value: 'price', label: '料金プラン' },
  { value: 'faq', label: 'よくある質問' },
  { value: 'cta', label: 'CTA（行動喚起）' },
  { value: 'profile', label: '会社・人物紹介' },
  { value: 'gallery', label: 'ギャラリー・実績' },
  { value: 'custom', label: 'カスタム' },
];

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function renderSectionList() {
  const list = document.getElementById('sectionList');
  if (sections.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📄</div><div>セクションを追加して<br>LP制作を始めましょう</div></div>`;
    return;
  }
  list.innerHTML = sections.map((s, i) => {
    const statusMap = { done: ['status-done','✓ 完了'], pending: ['status-pending','未生成'], generating: ['status-generating','生成中'] };
    const [cls, label] = statusMap[s.status] || statusMap.pending;
    return `
    <div class="section-card ${i === activeIdx ? 'active' : ''}" onclick="selectSection(${i})">
      <div class="section-card-header">
        <div class="section-number">${i+1}</div>
        <div class="section-name">${escHtml(s.name)}</div>
        <div class="section-status ${cls}">${label}</div>
      </div>
      ${s.prompt ? `<div class="section-prompt-preview">${escHtml(s.prompt.substring(0,80))}${s.prompt.length>80?'…':''}</div>` : ''}
    </div>`;
  }).join('');
}

function renderEditor() {
  const pane = document.getElementById('editorPane');
  const previewPane = document.getElementById('previewPane');
  const titleEl = document.getElementById('editorTitle');
  const upBtn = document.getElementById('moveUpBtn');
  const dnBtn = document.getElementById('moveDownBtn');
  const delBtn = document.getElementById('deleteSectionBtn');

  if (activeIdx === null || !sections[activeIdx]) {
    pane.innerHTML = `<div class="empty-state"><div class="icon">👈</div><div>左のリストからセクションを選ぶか<br>「＋ セクション追加」で始めましょう</div></div>`;
    previewPane.style.display = 'none';
    titleEl.textContent = 'セクションを選択してください';
    upBtn.disabled = dnBtn.disabled = delBtn.disabled = true;
    return;
  }

  const s = sections[activeIdx];
  titleEl.textContent = `${activeIdx + 1}. ${s.name}`;
  upBtn.disabled = activeIdx === 0;
  dnBtn.disabled = activeIdx === sections.length - 1;
  delBtn.disabled = false;

  const typeOptions = SECTION_TYPES.map(t => `<option value="${t.value}" ${s.sectionType===t.value?'selected':''}>${t.label}</option>`).join('');

  pane.innerHTML = `
    <div class="form-row">
      <div class="form-group" style="flex:1.2">
        <label>セクション名</label>
        <input type="text" value="${escHtml(s.name)}" oninput="updateSection('name', this.value)" placeholder="ヒーローセクション">
      </div>
      <div class="form-group" style="flex:1">
        <label>セクション種類</label>
        <select onchange="updateSection('sectionType', this.value)">${typeOptions}</select>
      </div>
    </div>
    <div class="form-group">
      <label>プロンプト（このセクションの内容）</label>
      <textarea rows="5" oninput="updateSection('prompt', this.value)" placeholder="例：洗練されたヒーローセクション。大きなキャッチコピー「売上を3倍にする」、サブコピー、CTAボタン。背景は青いグラデーション。">${escHtml(s.prompt)}</textarea>
    </div>
    <div class="form-group">
      <label>追加ルール（このセクション専用・オプション）</label>
      <textarea rows="2" oninput="updateSection('customRules', this.value)" placeholder="例：このセクションのみ写真背景を使う">${escHtml(s.customRules||'')}</textarea>
    </div>
    <div class="editor-actions">
      <button class="btn btn-primary" onclick="generateImage(${activeIdx})" id="genBtn_${activeIdx}" ${s.status==='generating'?'disabled':''}>
        ${s.status==='generating' ? '<span class="spinner"></span> 生成中...' : '🎨 画像生成'}
      </button>
      ${s.imageUrl||s.imageBase64 ? `<button class="btn btn-ghost btn-sm" onclick="regenerateImage(${activeIdx})">🔄 再生成</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="buildPromptPreview(${activeIdx})">📋 プロンプト確認</button>
    </div>
  `;

  // Preview
  if (s.imageUrl || s.imageBase64) {
    previewPane.style.display = 'flex';
    const src = s.imageBase64 ? `data:image/png;base64,${s.imageBase64}` : s.imageUrl;
    document.getElementById('imgContainer').innerHTML = `
      <div class="preview-img-wrap">
        <img src="${src}" alt="Section ${activeIdx+1}">
      </div>`;
  } else {
    previewPane.style.display = 'flex';
    document.getElementById('imgContainer').innerHTML = `
      <div class="preview-placeholder">
        <div class="icon">🖼</div>
        <div>画像を生成するとここに表示されます</div>
      </div>`;
  }
}

// ─────────────────────────────────────────────
// Update helpers
// ─────────────────────────────────────────────
function updateSection(field, value) {
  if (activeIdx === null) return;
  sections[activeIdx][field] = value;
  if (field === 'name') {
    document.getElementById('editorTitle').textContent = `${activeIdx + 1}. ${value}`;
    renderSectionList();
  }
  saveToStorage();
}

// ─────────────────────────────────────────────
// Prompt builder
// ─────────────────────────────────────────────
function buildFullPrompt(idx) {
  const s = sections[idx];
  const globalRules = (localStorage.getItem('lp_globalrules') || '').trim();
  const sectionType = SECTION_TYPES.find(t => t.value === s.sectionType)?.label || s.sectionType;
  let parts = [];
  parts.push(`商用LPの「${sectionType}」セクションの画像を生成してください。`);
  if (globalRules) parts.push(`【共通スタイルルール】\n${globalRules}`);
  if (s.prompt) parts.push(`【このセクションの内容】\n${s.prompt}`);
  if (s.customRules) parts.push(`【このセクション専用の追加ルール】\n${s.customRules}`);
  parts.push('画像はLP用の横幅いっぱいのバナー形式で、実際のWebページに使用できる高品質なデザインにしてください。テキストや要素の配置はWebデザインの慣例に従ってください。');
  return parts.join('\n\n');
}

function buildPromptPreview(idx) {
  const prompt = buildFullPrompt(idx);
  alert('【送信されるプロンプト】\n\n' + prompt);
}

// ─────────────────────────────────────────────
// Image generation
// ─────────────────────────────────────────────
async function generateImage(idx) {
  const apiKey = localStorage.getItem('lp_apikey') || '';
  if (!apiKey.startsWith('sk-')) {
    showToast('APIキーを設定してください（設定タブ）', 'error');
    showTab('settings-tab');
    return;
  }
  if (!sections[idx].prompt.trim()) {
    showToast('プロンプトを入力してください', 'error');
    return;
  }

  sections[idx].status = 'generating';
  saveToStorage();
  renderSectionList();
  renderEditor();

  const prompt = buildFullPrompt(idx);
  const [width, height] = selectedSize.split('x').map(Number);

  try {
    const res = await fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'gpt-image-1',
        prompt: prompt,
        n: 1,
        size: selectedSize,
        output_format: 'b64_json'
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const b64 = data.data?.[0]?.b64_json;
    if (!b64) throw new Error('画像データが取得できませんでした');

    sections[idx].imageBase64 = b64;
    sections[idx].imageUrl = null;
    sections[idx].status = 'done';
    saveToStorage();
    renderSectionList();
    renderEditor();
    showToast(`✓ セクション${idx+1}の生成完了！`, 'success');

  } catch(e) {
    sections[idx].status = 'pending';
    saveToStorage();
    renderSectionList();
    renderEditor();
    showToast('生成エラー: ' + e.message, 'error');
    console.error(e);
  }
}

function regenerateImage(idx) {
  if (!confirm('この画像を再生成しますか？現在の画像は上書きされます。')) return;
  sections[idx].imageBase64 = null;
  sections[idx].imageUrl = null;
  saveToStorage();
  generateImage(idx);
}

// ─────────────────────────────────────────────
// LP Preview
// ─────────────────────────────────────────────
function renderLPPreview() {
  const container = document.getElementById('lpPreview');
  if (sections.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📄</div><div>セクションがまだありません</div></div>`;
    return;
  }
  container.innerHTML = sections.map((s, i) => {
    if (s.imageBase64 || s.imageUrl) {
      const src = s.imageBase64 ? `data:image/png;base64,${s.imageBase64}` : s.imageUrl;
      return `<div class="lp-section-wrap">
        <img class="lp-section-img" src="${src}" alt="${escHtml(s.name)}">
        <div class="lp-section-overlay">${i+1}. ${escHtml(s.name)}</div>
      </div>`;
    } else {
      return `<div class="lp-section-wrap">
        <div style="background:var(--surface2);border:2px dashed var(--border);padding:40px;text-align:center;color:var(--text2);max-width:600px;width:100%">
          ${i+1}. ${escHtml(s.name)} — 未生成
        </div>
      </div>`;
    }
  }).join('');
}

// ─────────────────────────────────────────────
// Export
// ─────────────────────────────────────────────
function exportLP() {
  const hasSections = sections.some(s => s.imageBase64 || s.imageUrl);
  if (!hasSections) {
    showToast('生成済みの画像がありません', 'error');
    return;
  }
  const imagesHtml = sections.map((s, i) => {
    if (!s.imageBase64 && !s.imageUrl) return `<!-- Section ${i+1}: ${s.name} - 未生成 -->`;
    const src = s.imageBase64 ? `data:image/png;base64,${s.imageBase64}` : s.imageUrl;
    return `  <!-- ${i+1}. ${s.name} -->\n  <img src="${src}" alt="${escHtml(s.name)}" style="width:100%;display:block;">`;
  }).join('\n');

  const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; }
    .lp-container { max-width: 1200px; margin: 0 auto; }
    img { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="lp-container">
${imagesHtml}
  </div>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'landing-page.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ HTMLをエクスポートしました', 'success');
}

function exportData() {
  const data = {
    version: 1,
    globalRules: localStorage.getItem('lp_globalrules') || '',
    size: selectedSize,
    sections: sections.map(s => ({ ...s }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lp-project-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ プロジェクトを保存しました', 'success');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.sections) {
        if (!confirm(`${data.sections.length}件のセクションをインポートします。現在のデータは上書きされます。`)) return;
        sections = data.sections;
        if (data.globalRules) {
          localStorage.setItem('lp_globalrules', data.globalRules);
          document.getElementById('globalRules').value = data.globalRules;
        }
        if (data.size) selectSize(data.size, data.size);
        saveToStorage();
        activeIdx = null;
        renderSectionList();
        renderEditor();
        showToast(`✓ ${sections.length}件をインポートしました`, 'success');
      }
    } catch(err) { showToast('インポートエラー: JSONが無効です', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function clearAll() {
  if (!confirm('全セクションを削除しますか？この操作は元に戻せません。')) return;
  sections = [];
  activeIdx = null;
  saveToStorage();
  renderSectionList();
  renderEditor();
  showToast('全セクションを削除しました');
}

function applyGlobalRulesToAll() {
  showToast('共通ルールは次回の生成時に自動で適用されます ✓', 'success');
}

// ─────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.panel-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById(id + '-btn').classList.add('active');
}

function showMainView(id) {
  document.getElementById('editor-view').style.display = id === 'editor-view' ? 'flex' : 'none';
  document.getElementById('lp-preview-view').style.display = id === 'lp-preview-view' ? 'flex' : 'none';
  if (id === 'lp-preview-view') renderLPPreview();
}

let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
